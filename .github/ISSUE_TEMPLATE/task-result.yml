name: Authorized task result
description: Separate execution receipts, replies and actual product use for one small task
title: "[Task result] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Report one small authorized task and what happened after execution.
        This is a public issue. Do not include handles, email addresses, message bodies, account details, credentials or private target lists. Use aggregate counts and explicitly shareable proof links only.
        A send receipt alone is not a growth result. No reply and unknown are valid reports.
  - type: input
    id: version
    attributes:
      label: Growovo version or commit
    validations:
      required: true
  - type: dropdown
    id: task_type
    attributes:
      label: Task type
      options:
        - Synthetic demo
        - Authorized email task
        - X read-only / draft task
        - GitHub / Discord authorized task
        - Other authorized task
    validations:
      required: true
  - type: textarea
    id: qualification
    attributes:
      label: Audience and qualification reason
      description: Who the task was for and why the problem was relevant. Do not identify private individuals.
    validations:
      required: true
  - type: textarea
    id: execution
    attributes:
      label: Execution and safety result
      description: Aggregate committed / blocked / indeterminate / DNC outcomes and the public proof link, if any. Do not paste private content.
    validations:
      required: true
  - type: dropdown
    id: conversation
    attributes:
      label: Conversation result
      options:
        - Qualified external reply
        - External reply, not qualified
        - No external reply observed
        - Reply status unknown
        - Not applicable / synthetic only
    validations:
      required: true
  - type: textarea
    id: next_step
    attributes:
      label: Actual next step and owner
      description: Continue, clarify, hand off, stop, or collect product facts. Say what actually happened, not what the copy hoped would happen.
    validations:
      required: true
  - type: dropdown
    id: product_event
    attributes:
      label: Independently observed product event
      options:
        - Install / reproduction / activation observed
        - A different product event observed
        - No product event observed
        - Product events not measured
        - Not applicable / synthetic only
    validations:
      required: true
  - type: input
    id: human_minutes
    attributes:
      label: Human review and follow-up minutes
      description: Include targeting, review, exception handling and replies. Use `unknown` if not measured.
  - type: dropdown
    id: second_use
    attributes:
      label: Second independent batch
      options:
        - Completed
        - Planned but not run
        - Not repeated
        - Not applicable / synthetic only
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Evidence and platform boundaries
      options:
        - label: This issue contains no private recipients, content, account data or credentials
          required: true
        - label: I have not treated sends, exposure, stars or attributed outcomes as causal proof
          required: true
        - label: No unsolicited bulk sending; any non-API X write ran through a named owner-attested managed tab with account authorization and readback
          required: true
