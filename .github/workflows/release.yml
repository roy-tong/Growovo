name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require tag on main and matching package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          git fetch origin main:refs/remotes/origin/main
          TARGET="$(git rev-list -n 1 "$TAG")"
          git merge-base --is-ancestor "$TARGET" origin/main
          VER="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "$TAG" = "v$VER"
          echo "release guard: $TAG -> $TARGET on origin/main, version $VER"

  release:
    needs: release-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract release notes
        run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}" /tmp/notes.md
      - name: Offline tests and demo
        run: |
          python -m unittest discover tests -v
          python mkt.py demo
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "Growovo ${TAG#v}" --notes-file /tmp/notes.md
          fi

  # ── PyPI: `pipx install growovo` ──
  # Uses PyPI trusted publishing (OIDC): no API token to store or leak.
  # One-time setup on PyPI (account owner): Publishing → Add a pending publisher
  #   PyPI project name: growovo
  #   owner: roy-tong · repository: Growovo · workflow: release.yml
  #   environment: (leave empty)
  pypi-publish:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Skip if this version is already live on PyPI (idempotent re-runs)
        run: |
          VER="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])" 2>/dev/null || echo unknown)"
          LIVE="$(curl -sf "https://pypi.org/pypi/growovo/json" | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo none)"
          echo "local=$VER live=$LIVE"
          if [[ "$VER" != "unknown" && "$VER" == "$LIVE" ]]; then
            echo "growovo $VER already live on PyPI — skipping publish"
            echo "pypi_skip=true" >> "$GITHUB_ENV"
          else
            echo "pypi_skip=false" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        if: ${{ env.pypi_skip != 'true' }}
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        if: ${{ env.pypi_skip != 'true' }}
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build
      - name: Isolated wheel smoke (offline, no browser needed)
        if: ${{ env.pypi_skip != 'true' }}
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --no-deps dist/*.whl
          /tmp/smoke/bin/mkt --help >/dev/null
          /tmp/smoke/bin/mkt doctor
          /tmp/smoke/bin/python -I scripts/wheel_smoke.py
      - name: Publish growovo to PyPI
        if: ${{ env.pypi_skip != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
