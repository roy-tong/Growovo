name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract release notes
        run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}" /tmp/notes.md
      - name: Offline tests and demo
        run: |
          python -m unittest discover tests -v
          python mkt.py demo
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "Growovo ${TAG#v}" --notes-file /tmp/notes.md
          fi
