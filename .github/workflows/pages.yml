name: website

on:
  push:
    branches: [main]
    paths: ['website/**', 'scripts/seo_check.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Failure-injection self-test (the gate must be able to fail)
        run: python3 scripts/seo_check.py --selftest
      - name: Sitemap, canonical, links, JSON-LD and review dates
        run: python3 scripts/seo_check.py

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Remove stale Pages artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')
          for artifact_id in $artifact_ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - uses: actions/deploy-pages@v4
        id: deployment
