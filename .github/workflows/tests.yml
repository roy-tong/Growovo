name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04  # Python 3.9 is unavailable on Ubuntu 26.04 runners
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline unit tests
        run: |
          python - <<'PY'
          import re, subprocess, sys
          run = subprocess.run([sys.executable, "-m", "unittest", "discover", "tests", "-v"],
                               capture_output=True, text=True)
          output = run.stdout + run.stderr
          print(output)
          if run.returncode:
              blocks = re.findall(r"={70}\n(?:FAIL|ERROR):.*?(?=={70}\n|\Z)", output, re.S)
              for block in blocks[:10]:
                  message = block[:12000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error::" + message)
          raise SystemExit(run.returncode)
          PY
      - name: Zero-network demo
        run: python mkt.py demo
      - name: Doctor self-test
        run: python mkt.py doctor --selftest

      - name: Build and accept the installed wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/growovo-smoke
          /tmp/growovo-smoke/bin/pip install --no-deps dist/*.whl
          /tmp/growovo-smoke/bin/python -I scripts/wheel_smoke.py
