name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline unit tests
        run: python -m unittest discover tests -v
      - name: Zero-network demo
        run: python mkt.py demo
      - name: Doctor self-test
        run: python mkt.py doctor --selftest
